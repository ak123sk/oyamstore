<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - App Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .categories-page { padding: 40px 0; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 1.8rem; color: #333; margin-bottom: 6px; }
        .page-header p { color: #888; font-size: 15px; }

        .category-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 40px;
        }
        .category-card {
            background: #fff;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .category-card:hover, .category-card.active {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
            border-color: var(--primary-color);
        }
        .category-card i { font-size: 2rem; margin-bottom: 10px; display: block; }
        .category-card span { font-size: 14px; font-weight: 600; color: #333; }

        .apps-section { margin-top: 10px; }
        .apps-section h2 { font-size: 1.2rem; color: #333; margin-bottom: 20px; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
        .app-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover { transform: translateY(-3px); box-shadow: var(--hover-shadow); }
        .app-card .app-icon { width: 60px; height: 60px; border-radius: 14px; margin-bottom: 12px; object-fit: cover; }
        .app-card-info h3 { font-size: 15px; margin-bottom: 3px; }
        .app-card-info p { font-size: 13px; color: #888; margin-bottom: 6px; }
        .app-card-rating { font-size: 12px; }
        .app-card-rating .stars { color: #FFD700; }
    </style>
</head>
<body>
    <div id="app">
        <div id="navbar-container"></div>
        <main class="categories-page">
            <div class="container">
                <div class="page-header">
                    <h1>Browse Categories</h1>
                    <p>Find the perfect app for every need</p>
                </div>
                <div class="category-grid-full" id="all-categories"></div>
                <div class="apps-section">
                    <h2 id="category-title">All Apps</h2>
                    <div class="app-grid" id="category-apps">
                        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        let allAppsData = {};
        let allCategories = [];

        async function initCategoryPage() {
            try {
                const [appsInfo, appsExp, devInfo, catData] = await Promise.all([
                    APIService.fetchAppsInfo(),
                    APIService.fetchAppsExperience(),
                    APIService.fetchDeveloperInfo(),
                    fetch('data/category.json').then(r => r.json())
                ]);

                allCategories = catData.categories;

                appsInfo.apps.forEach(app => {
                    const exp = appsExp.apps.find(e => e.package_name === app.package_name) || {};
                    const dev = devInfo.developers.find(d => d.package_name === app.package_name) || {};
                    allAppsData[app.package_name] = { ...app, experience: exp, developer: dev };
                });

                renderCategories(catData.categories);

                const urlParams = new URLSearchParams(window.location.search);
                const activeCategory = urlParams.get('category');
                if (activeCategory) {
                    filterApps(activeCategory);
                } else {
                    renderApps(Object.values(allAppsData));
                }
            } catch (e) {
                console.error(e);
                document.getElementById('category-apps').innerHTML =
                    '<p style="color:#888;padding:20px;">Failed to load apps.</p>';
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('all-categories');
            const colors = ['#2196F3','#E91E63','#9C27B0','#FF5722','#4CAF50','#00BCD4','#FF9800','#607D8B'];
            container.innerHTML = categories.map((cat, i) => `
                <div class="category-card" onclick="filterApps('${cat.id}')" id="cat-${cat.id}">
                    <i class="fas ${cat.icon}" style="color:${colors[i % colors.length]}"></i>
                    <span>${SecurityManager.sanitizeInput(cat.name)}</span>
                </div>
            `).join('');
        }

        function filterApps(categoryId) {
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById('cat-' + categoryId);
            if (activeCard) activeCard.classList.add('active');

            const cat = allCategories.find(c => c.id === categoryId);
            document.getElementById('category-title').textContent = cat ? cat.name + ' Apps' : 'All Apps';

            const filtered = Object.values(allAppsData).filter(a => a.category === categoryId);
            renderApps(filtered);
        }

        function renderApps(apps) {
            const container = document.getElementById('category-apps');
            if (apps.length === 0) {
                container.innerHTML = '<div class="no-results"><i class="fas fa-box-open"></i><h3>No apps in this category yet</h3><p>Check back soon!</p></div>';
                return;
            }
            const tempStore = window.appStore || { generateStars: (r) => '★'.repeat(Math.round(r)) };
            container.innerHTML = apps.map(app => `
                <div class="app-card" onclick="window.location.href='app.html?package=${app.package_name}'">
                    <img src="${APIService.getLogoURL(app.logo || '')}"
                         alt="${SecurityManager.sanitizeInput(app.name)}"
                         class="app-icon"
                         onerror="this.src='assets/icons/default-app-icon.svg'">
                    <div class="app-card-info">
                        <h3>${SecurityManager.sanitizeInput(app.name)}</h3>
                        <p>${SecurityManager.sanitizeInput(app.developer?.name || 'Unknown Developer')}</p>
                        <div class="app-card-rating">
                            <span class="stars">${window.appStore ? window.appStore.generateStars(app.rating || 0) : ''}</span>
                            <span>${(app.downloads || 0).toLocaleString()}+ downloads</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', initCategoryPage);
    </script>
</body>
</html>
