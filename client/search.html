<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - App Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .search-page { padding: 40px 0; }
        .search-bar-top {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            position: relative;
        }
        .search-bar-top input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar-top input:focus { border-color: var(--primary-color); }
        .search-bar-top button {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 18px;
            cursor: pointer;
        }
        #search-suggestions {
            display: none;
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            background: #fff;
            border-radius: 0 0 12px 12px;
            box-shadow: var(--hover-shadow);
            z-index: 100;
        }
        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .suggestion-item:hover { background: #f5f5f5; }
        .suggestion-icon { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-header h2 { font-size: 1.1rem; color: #333; }
        #result-count { color: #888; font-size: 14px; }
        .app-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .app-card:hover { box-shadow: var(--hover-shadow); transform: translateY(-2px); }
        .app-card .app-icon { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
        .app-card-info h3 { font-size: 15px; margin-bottom: 3px; }
        .app-card-info p { font-size: 13px; color: #888; margin-bottom: 5px; }
        .app-card-rating { font-size: 12px; color: #FFD700; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="navbar-container"></div>
        <main class="search-page">
            <div class="container">
                <div class="search-bar-top">
                    <form id="search-form">
                        <input type="text" id="search-input" placeholder="Search apps, games, tools..." autocomplete="off">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>
                    <div id="search-suggestions"></div>
                </div>
                <div class="result-header">
                    <h2>Search Results</h2>
                    <span id="result-count"></span>
                </div>
                <div id="search-results" class="app-grid">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
